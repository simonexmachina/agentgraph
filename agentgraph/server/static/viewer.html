<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentGraph Viewer</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/@mozilla/readability@0.5.0/Readability.js"></script>
<script src="https://unpkg.com/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #0d0f14;
    --surface:      #141720;
    --surface2:     #1a1f2e;
    --border:       #242938;
    --border-bright:#2e3650;
    --accent:       #e8a045;
    --accent-dim:   #a06820;
    --green:        #4ade80;
    --blue:         #60a5fa;
    --purple:       #a78bfa;
    --pink:         #f472b6;
    --cyan:         #22d3ee;
    --text:         #e2e8f0;
    --text-muted:   #64748b;
    --text-dim:     #94a3b8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }

  /* ── layout ────────────────────────────────────────────────────────────── */
  #app {
    --sidebar-width: clamp(240px, 18vw, 300px);
    --detail-width: clamp(320px, 28vw, 440px);
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr) 0;
    height: 100vh;
    overflow: hidden;
    transition: grid-template-columns 0.2s ease;
  }

  #app.detail-open,
  #app:has(#detail.open) {
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--detail-width);
  }

  /* ── sidebar ───────────────────────────────────────────────────────────── */
  #sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 12px;
    gap: 16px;
  }

  #sidebar-footer {
    display: flex;
    flex: 0 0 auto;
    justify-content: flex-end;
    margin-top: auto;
  }

  #shortcut-help-btn {
    position: static;
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
  }

  #shortcut-help-btn[aria-pressed="true"] {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
  }

  #sidebar-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #sidebar h1 a {
    display: block;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    text-decoration: none;
    text-transform: uppercase;
  }

  #sidebar h1 a:hover {
    color: var(--text);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-section + .sidebar-section {
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .sidebar-section h2 {
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .control-group label.group-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  input[type="text"],
  select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus,
  select:focus {
    border-color: var(--accent);
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 13px;
    height: 13px;
  }

  .checkbox-row span {
    color: var(--text-dim);
    font-size: 12px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .range-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .range-row span {
    color: var(--accent);
    font-size: 12px;
    min-width: 32px;
    text-align: right;
  }

  button {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    color: var(--text-dim);
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    width: 100%;
  }

  button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .input-actions {
    display: flex;
    gap: 6px;
  }

  .input-shell {
    flex: 1 1 auto;
    min-width: 0;
    position: relative;
  }

  .input-shell input {
    padding-right: 30px;
  }

  .input-shell input:placeholder-shown + .input-clear {
    display: none;
  }

  .input-shell .input-clear {
    background: transparent;
    border: 0;
    height: 100%;
    padding: 0;
    position: absolute;
    right: 1px;
    top: 0;
    width: 26px;
  }

  .input-actions > input {
    flex: 1 1 auto;
    min-width: 0;
  }

  .input-actions button {
    flex: 0 0 auto;
    width: auto;
  }

  .input-clear {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    padding-inline: 8px;
  }

  /* ── canvas area ────────────────────────────────────────────────────────── */
  #canvas-wrap {
    min-width: 0;
    position: relative;
    overflow: hidden;
  }

  #view-tabs {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 7;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: 5px;
    overflow: hidden;
  }

  #viewer-order {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 11px;
  }

  #viewer-order label { white-space: nowrap; }
  #viewer-order select { width: auto; min-width: 128px; padding: 6px 8px; }
  #viewer-order button { width: auto; min-width: 48px; padding: 6px 8px; }

  .view-tab {
    width: auto;
    border: 0;
    border-radius: 0;
    padding: 6px 10px;
    color: var(--text-muted);
  }

  .view-tab + .view-tab { border-left: 1px solid var(--border-bright); }
  .view-tab.active { background: var(--surface2); color: var(--accent); }

  #list-view {
    display: none;
    width: 100%;
    height: 100%;
    padding: 52px 12px 12px;
  }

  #node-table {
    height: 100%;
    overflow: auto;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  #node-list {
    width: 100%;
    min-width: 1290px;
    border-collapse: collapse;
    color: var(--text);
  }

  #node-list th,
  #node-list td {
    padding: 7px 9px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }

  #node-list th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  #node-list tbody tr { cursor: pointer; }
  #node-list tbody tr:nth-child(even) { background: #11141c; }
  #node-list tbody tr:hover,
  #node-list tbody tr:focus-visible { background: var(--surface2); outline: none; }
  #node-list tbody tr[aria-selected="true"] {
    background: rgba(96, 165, 250, 0.18);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  #node-list tbody tr[aria-selected="true"]:hover,
  #node-list tbody tr[aria-selected="true"]:focus-visible {
    background: rgba(96, 165, 250, 0.24);
  }
  #node-list td:nth-child(1) { min-width: 240px; width: 30%; }
  #node-list td:nth-child(2),
  #node-list td:nth-child(3) { width: 110px; }
  #node-list td:nth-child(4),
  #node-list td:nth-child(5),
  #node-list td:nth-child(6),
  #node-list td:nth-child(7),
  #node-list td:nth-child(8) { width: 175px; white-space: nowrap; }
  #node-list td:nth-child(9) { width: 80px; text-align: right; }

  .list-sort {
    width: auto;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
  }

  .list-sort:hover { border: 0; color: var(--accent); }
  .list-sort[data-direction="asc"]::after { content: " ↑"; }
  .list-sort[data-direction="desc"]::after { content: " ↓"; }

  #list-empty {
    padding: 24px;
    color: var(--text-muted);
    text-align: center;
  }

  #more-btn {
    display: none;
    position: absolute;
    right: 20px;
    bottom: 20px;
    z-index: 7;
    width: auto;
    min-width: 72px;
    color: var(--text);
    background: var(--surface2);
    border-color: var(--accent-dim);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  #cy {
    width: 100%;
    height: 100%;
  }

  #hover-card {
    position: absolute;
    min-width: 180px;
    max-width: 320px;
    padding: 10px 12px;
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    background: rgba(20, 23, 32, 0.96);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    z-index: 6;
    display: none;
    backdrop-filter: blur(8px);
  }

  #hover-card.open {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #hover-card-type {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #hover-card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    word-break: break-word;
  }

  #hover-card-meta {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  #hover-card-snippet {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.45;
    word-break: break-word;
  }

  /* ── spinner ────────────────────────────────────────────────────────────── */
  #spinner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13, 15, 20, 0.55);
    z-index: 10;
    pointer-events: none;
  }

  #spinner.active {
    display: flex;
  }

  .spinner-ring {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border-bright);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── detail panel ───────────────────────────────────────────────────────── */
  #detail {
    grid-column: 3;
    width: var(--detail-width);
    min-width: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    position: relative;
    z-index: 5;
  }

  #detail.open {
    transform: translateX(0);
  }

  @media (max-width: 1100px) {
    #app,
    #app.detail-open {
      display: flex;
    }

    #sidebar {
      width: 220px;
      min-width: 220px;
    }

    #canvas-wrap {
      flex: 1;
    }

    #detail {
      width: min(360px, 82vw);
      min-width: min(360px, 82vw);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
    }
  }

  #detail-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  #detail-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
    word-break: break-word;
  }

  #detail-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #detail-entity-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .detail-icon-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px;
    width: 22px;
    height: 22px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .detail-icon-btn:hover {
    color: var(--accent);
    border: none;
  }

  .detail-icon-btn:disabled {
    cursor: default;
    opacity: 1;
  }

  .bookmark-glyph {
    width: 12px;
    height: 16px;
    display: block;
    overflow: visible;
    fill: transparent;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linejoin: round;
  }

  .focus-glyph {
    width: 14px;
    height: 14px;
    display: block;
    overflow: visible;
    fill: transparent;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
  }

  #detail-focus[aria-pressed="true"] {
    color: var(--accent);
  }

  #detail-bookmark[aria-pressed="true"] {
    color: #fbbf24;
  }

  #detail-bookmark[aria-pressed="true"] .bookmark-glyph {
    fill: currentColor;
  }

  #detail-delete:hover {
    color: #f87171;
  }

  .delete-glyph {
    width: 14px;
    height: 14px;
    display: block;
    overflow: visible;
    fill: transparent;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #detail-close {
    font-size: 16px;
  }

  #detail-body {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #shortcut-body {
    padding: 14px;
  }

  #shortcut-body[hidden] {
    display: none;
  }

  .shortcut-intro {
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .shortcut-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shortcut-list div {
    align-items: center;
    display: flex;
    gap: 10px;
  }

  .shortcut-list dt {
    flex: 0 0 28px;
  }

  .shortcut-list dd {
    color: var(--text-dim);
    line-height: 1.4;
  }

  kbd {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    color: var(--text);
    display: inline-block;
    font-family: inherit;
    font-size: 11px;
    min-width: 24px;
    padding: 3px 5px;
    text-align: center;
  }

  .detail-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .detail-row .detail-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
  }

  .detail-row .detail-value {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.5;
    word-break: break-word;
  }

  .person-merge-error {
    color: #fca5a5;
    font-size: 11px;
    line-height: 1.4;
    display: none;
  }

  .merged-people-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .merged-person-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-dim);
    font-size: 11px;
    line-height: 1.4;
    padding: 6px 8px;
    word-break: break-word;
  }

  .merged-person-item strong {
    color: var(--text);
    display: block;
    font-weight: 600;
  }

  .content-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .content-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .content-format {
    color: var(--text-muted);
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .content-format:hover,
  .content-format:focus-visible {
    color: var(--text);
  }

  .content-format[aria-expanded="false"]::before { content: "+ "; }
  .content-format[aria-expanded="true"]::before { content: "- "; }

  .content-tabs {
    display: flex;
    gap: 3px;
  }

  .content-tab {
    width: auto;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    padding: 3px 6px;
    font-size: 10px;
  }

  .content-tab[aria-selected="true"] {
    border-color: var(--border-bright);
    color: var(--text);
    background: var(--surface2);
  }

  .content-tab:disabled,
  .content-tab:disabled:hover {
    border-color: transparent;
    color: var(--text-muted);
    cursor: default;
    opacity: 0.45;
  }

  .content-preview,
  .content-source {
    border: 1px solid var(--border);
    border-radius: 5px;
    background: #10131b;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.65;
    overflow: auto;
  }

  .content-preview {
    padding: 14px 16px;
  }

  .content-preview > :first-child { margin-top: 0; }
  .content-preview > :last-child { margin-bottom: 0; }
  .content-preview h1,
  .content-preview h2,
  .content-preview h3,
  .content-preview h4 {
    color: var(--text);
    line-height: 1.3;
    margin: 1.2em 0 0.45em;
  }
  .content-preview h1 { font-size: 20px; }
  .content-preview h2 { font-size: 17px; }
  .content-preview h3 { font-size: 15px; }
  .content-preview h4 { font-size: 13px; }
  .content-preview p,
  .content-preview ul,
  .content-preview ol,
  .content-preview blockquote,
  .content-preview pre,
  .content-preview table {
    margin: 0.75em 0;
  }
  .content-preview ul,
  .content-preview ol { padding-left: 1.4em; }
  .content-preview blockquote {
    border-left: 3px solid var(--accent-dim);
    color: var(--text-muted);
    padding-left: 10px;
  }
  .content-preview a {
    color: var(--blue);
    overflow-wrap: anywhere;
  }
  .content-preview code,
  .content-preview pre {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .content-preview code {
    background: var(--surface2);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 0.9em;
  }
  .content-preview pre {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: auto;
    padding: 10px;
  }
  .content-preview pre code {
    background: transparent;
    padding: 0;
  }
  .content-preview table {
    border-collapse: collapse;
    display: block;
    max-width: 100%;
    overflow-x: auto;
  }
  .content-preview th,
  .content-preview td {
    border: 1px solid var(--border-bright);
    padding: 4px 7px;
    text-align: left;
  }

  .content-source {
    display: block;
    margin: 0;
    padding: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.55;
  }

  .content-preview[hidden],
  .content-source[hidden] {
    display: none;
  }

  .tag {
    display: inline-block;
    border-radius: 3px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 0.03em;
  }

  .edges-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .edge-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.12s;
  }

  .edge-item:hover {
    border-color: var(--accent-dim);
    color: var(--text);
  }

  .edge-item .edge-type-tag {
    font-weight: 700;
    font-family: monospace;
    font-size: 10px;
    margin-right: 4px;
  }

  /* ── empty state ────────────────────────────────────────────────────────── */
  #empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <h1><a href="/viewer">AgentGraph</a></h1>

    <form id="sidebar-form">
      <section class="sidebar-section" aria-labelledby="search-heading">
        <h2 id="search-heading">Search</h2>
        <div class="input-actions">
          <div class="input-shell">
            <input type="text" id="search-input" aria-label="Search" placeholder="Search entities…" />
