name: PyPI Release

on:
  push:
    tags:
      - "agentgraph-server-v*"
      - "agentgraph-connector-*-v*"
  # Manual recovery path. GitHub drops push events when a single push carries more
  # than a few tags, which silently skips those releases, and a missed event cannot
  # be replayed by re-pushing an existing tag. Dispatch this workflow from a branch
  # that has this trigger and name the tag to publish; the jobs below check out the
  # tag itself, so the release is built from the tagged tree rather than the ref the
  # dispatch ran against.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. agentgraph-connector-web-v0.5.6"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve release package
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: uv run python scripts/release_package.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build --package "${{ needs.resolve.outputs.package }}" --out-dir "dist/${{ needs.resolve.outputs.package }}"

      - name: Validate distribution
        run: uvx twine check "dist/${{ needs.resolve.outputs.package }}"/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-${{ needs.resolve.outputs.package }}
          path: dist/${{ needs.resolve.outputs.package }}/
          retention-days: 1

  server-release-smoke:
    needs: [resolve, build]
    if: needs.resolve.outputs.package == 'agentgraph-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-agentgraph-server
          path: dist/agentgraph-server/

      - name: Run installed-package smoke test
        run: |
          mkdir -p release-smoke-artifacts
          wheel="$(find dist/agentgraph-server -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          scripts/test_release_container.sh "$wheel" release-smoke-artifacts

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentgraph-server-release-smoke-${{ github.run_id }}
          path: release-smoke-artifacts/
          if-no-files-found: ignore

  publish-server:
    needs: [resolve, build, server-release-smoke]
    if: needs.resolve.outputs.package == 'agentgraph-server'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-agentgraph-server
          path: dist/agentgraph-server/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/agentgraph-server/

  publish-connectors:
    needs: [resolve, build]
    if: needs.resolve.outputs.package != 'agentgraph-server'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-${{ needs.resolve.outputs.package }}
          path: dist/${{ needs.resolve.outputs.package }}/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ needs.resolve.outputs.package }}/
