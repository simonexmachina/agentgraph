[project]
name = "agentgraph-server"
version = "0.8.0"
description = "A local-first CLI and MCP server that turns selected digital sources into a searchable graph for the AI agent you already use."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "agentgraph-connector-web>=0.6.0,<0.7",
    "apscheduler>=3.11.2",
    "click<8.4",
    "fastapi>=0.135.2",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "mcp>=1.26.0,<2",
    "numpy>=2.4.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "questionary>=2.1.1",
    "rich>=14.3.3",
    "sqlite-vec>=0.1.9",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
google     = ["agentgraph-connector-google>=0.6.0,<0.7"]
slack      = ["agentgraph-connector-slack>=0.6.0,<0.7"]
discord    = ["agentgraph-connector-discord>=0.6.0,<0.7"]
rss        = ["agentgraph-connector-rss>=0.6.0,<0.7"]
web        = ["agentgraph-connector-web>=0.6.0,<0.7"]
all        = [
    "agentgraph-connector-web>=0.6.0,<0.7",
    "agentgraph-connector-google>=0.6.0,<0.7",
    "agentgraph-connector-slack>=0.6.0,<0.7",
    "agentgraph-connector-discord>=0.6.0,<0.7",
    "agentgraph-connector-rss>=0.6.0,<0.7",
]

[dependency-groups]
dev = [
    "pygments>=2.19.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "playwright>=1.62.0",
]

[project.scripts]
agentgraph = "agentgraph.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "browser: marks tests that require a browser (run separately in CI)",
    "integration: marks tests that require a live database (deselect with '-m not integration')",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentgraph-connector-google  = { workspace = true }
agentgraph-connector-slack   = { workspace = true }
agentgraph-connector-discord = { workspace = true }
agentgraph-connector-rss     = { workspace = true }
agentgraph-connector-web     = { workspace = true }

[tool.setuptools.packages.find]
include = ["agentgraph*"]

[tool.setuptools.package-data]
"agentgraph" = ["demo_fixtures/*.md"]
"agentgraph.backends.sqlite" = ["schema.sql"]
"agentgraph.server" = ["static/*.html"]

[tool.setuptools.data-files]
".agents/skills/agentgraph" = [".agents/skills/agentgraph/SKILL.md"]
".agents/skills/agentgraph/references" = [".agents/skills/agentgraph/references/*.md"]
".agents/skills/slack-auth" = [".agents/skills/slack-auth/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["agentgraph"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "agentgraph",
    "examples",
    "packages/agentgraph-connector-discord/agentgraph_connector_discord",
    "packages/agentgraph-connector-google/agentgraph_connector_google",
    "packages/agentgraph-connector-rss/agentgraph_connector_rss",
    "packages/agentgraph-connector-slack/agentgraph_connector_slack",
    "packages/agentgraph-connector-web/agentgraph_connector_web",
    "scripts",
    "tests",
]
extraPaths = [
    "packages/agentgraph-connector-discord",
    "packages/agentgraph-connector-google",
    "packages/agentgraph-connector-rss",
    "packages/agentgraph-connector-slack",
    "packages/agentgraph-connector-web",
]
