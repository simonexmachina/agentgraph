<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AgentGraph: The perception layer for coding agents</title>
  <desc id="description">Selected digital sources become a local graph that an existing coding agent can search and traverse.</desc>
  <rect width="1200" height="630" fill="#07080a"/>
  <path d="M78 84H1122" stroke="#35413e" stroke-width="2"/>
  <circle cx="94" cy="58" r="9" fill="#00f5a0"/>
  <text x="116" y="67" fill="#f5f7f5" font-family="Georgia, serif" font-size="33" font-weight="bold">AgentGraph</text>

  <text x="78" y="197" fill="#f5f7f5" font-family="Georgia, serif" font-size="73" font-weight="bold">The perception layer</text>
  <text x="78" y="284" fill="#00f5a0" font-family="Georgia, serif" font-size="73" font-weight="bold">for coding agents.</text>
  <text x="81" y="345" fill="#c5d0cb" font-family="Arial, sans-serif" font-size="25">Selected digital context. One local graph. Your existing agent.</text>

  <path d="M78 397H1122" stroke="#35413e" stroke-width="2"/>
  <rect x="78" y="425" width="288" height="120" rx="6" fill="#101715" stroke="#2b4138" stroke-width="2"/>
  <rect x="456" y="425" width="288" height="120" rx="6" fill="#101715" stroke="#2b4138" stroke-width="2"/>
  <rect x="834" y="425" width="288" height="120" rx="6" fill="#101715" stroke="#2b4138" stroke-width="2"/>
  <text x="98" y="465" fill="#00f5a0" font-family="Arial, sans-serif" font-size="17" font-weight="bold">SELECTED SOURCES</text>
  <text x="98" y="505" fill="#e2e8e4" font-family="Arial, sans-serif" font-size="21">Mail / docs / chats / feeds</text>
  <text x="476" y="465" fill="#ffd24a" font-family="Arial, sans-serif" font-size="17" font-weight="bold">LOCAL GRAPH</text>
  <text x="476" y="505" fill="#e2e8e4" font-family="Arial, sans-serif" font-size="21">People / content / links</text>
  <text x="854" y="465" fill="#ff6e9d" font-family="Arial, sans-serif" font-size="17" font-weight="bold">YOUR CODING AGENT</text>
  <text x="854" y="505" fill="#e2e8e4" font-family="Arial, sans-serif" font-size="21">Search / traverse / cite</text>
  <path d="M384 485H431m-13-12 13 12-13 12M762 485h47m-13-12 13 12-13 12" fill="none" stroke="#9fc9b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 580H1122" stroke="#35413e" stroke-width="2"/>
  <text x="78" y="609" fill="#91a69d" font-family="Arial, sans-serif" font-size="17">Local-first / self-hosted / open source</text>
</svg>
