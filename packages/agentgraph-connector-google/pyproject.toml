[project]
name = "agentgraph-connector-google"
version = "0.6.1"
description = "Google Docs, Sheets, Gmail, and Drive connectors for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agentgraph-server>=0.9.0,<1.0",
    "google-api-python-client>=2.193.0",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.0",
]

[project.entry-points."agentgraph.connectors"]
gdocs   = "agentgraph_connector_google.gdocs:GoogleDocsConnector"
gsheets = "agentgraph_connector_google.gsheets:GoogleSheetsConnector"
gmail   = "agentgraph_connector_google.gmail:GmailConnector"
gdrive = "agentgraph_connector_google.gdrive:DriveChangesConnector"

[tool.uv]
package = true

[tool.uv.sources]
agentgraph-server = { workspace = true }
