[project]
name = "agentgraph-connector-slack"
version = "0.6.1"
description = "Slack connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agentgraph-server>=0.9.0,<1.0",
    "httpx>=0.28.1",
]

[project.entry-points."agentgraph.connectors"]
slack = "agentgraph_connector_slack:SlackConnector"

[tool.uv]
package = true

[tool.uv.sources]
agentgraph-server = { workspace = true }

[tool.setuptools.package-data]
agentgraph_connector_slack = ["slack-app-manifest.json"]
