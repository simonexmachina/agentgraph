[project]
name = "agentgraph-connector-rss"
version = "0.7.0"
description = "RSS and Atom connector for AgentGraph"
requires-python = ">=3.12"
dependencies = [
    "agentgraph-server>=0.9.0,<1.0",
    "agentgraph-connector-web>=0.7.0,<0.8",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[project.entry-points."agentgraph.connectors"]
rss = "agentgraph_connector_rss:RssConnector"

[tool.uv]
package = true

[tool.uv.sources]
agentgraph-server = { workspace = true }
agentgraph-connector-web = { workspace = true }
